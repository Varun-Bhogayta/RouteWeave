# RouteWeave Tier Configuration
# Using locally available Ollama models for end-to-end testing

tiers:
  - id: local-fast
    label: "Local Fast (Gemma3 1B)"
    model: gemma3:1b
    provider: ollama
    conditions:
      complexity: [low]
      category: [code, general, data]
    cost_limit:
      max_tokens_per_request: 2000
      max_usd_per_day: null
    fallback: null

  - id: local-mid
    label: "Local Mid (Gemma4 2B)"
    model: gemma4:e2b
    provider: ollama
    conditions:
      complexity: [medium]
      category: [code, data, reasoning, general]
    cost_limit:
      max_tokens_per_request: 8000
      max_usd_per_day: null
    fallback: null

  - id: local-premium
    label: "Local Premium (Gemma4 4B)"
    model: gemma4:e4b
    provider: ollama
    conditions:
      complexity: [high]
      category: [code, reasoning, data, general]
    cost_limit:
      max_tokens_per_request: 32000
      max_usd_per_day: null
    fallback: null
