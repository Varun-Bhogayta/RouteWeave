version: "3.8"

# ── Test Compose File ──────────────────────────────────────────────────────────
# Runs the full pytest suite INSIDE Docker. No real services needed —
# all external calls (llama.cpp, Redis) are mocked in the test suite.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.test.yml run --rm test    # one-shot
# ──────────────────────────────────────────────────────────────────────────────

services:
  test:
    build:
      context: .
      target: test          # build only up to the 'test' stage in Dockerfile
    environment:
      # Point to mock-safe defaults; tests override these with mocks anyway
      LLAMA_CPP_URL: "http://localhost:8080"
      REDIS_URL: "redis://localhost:6379"
      TIER_CONFIG_PATH: "config/tiers.yaml"
      CLASSIFIER_MODEL: "phi3:mini"
      LOG_LEVEL: "WARNING"
    # No depends_on — all external calls are mocked in tests
