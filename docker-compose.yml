version: "3.8"

services:
  router:
    build:
      context: .
      target: production    # use only the production stage
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./config:/app/config
    depends_on:
      - redis
      - llama-cpp

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - llama_models:/models
    command: >
      /bin/sh -c "
      if [ ! -f /models/phi-3-mini-4k-instruct.Q4_K_M.gguf ]; then
        apt-get update && apt-get install -y wget &&
        wget -qO /models/phi-3-mini-4k-instruct.Q4_K_M.gguf https://huggingface.co/microsoft/Phi-3-mini-4k-instruct-gguf/resolve/main/Phi-3-mini-4k-instruct-q4.gguf
      fi &&
      /app/llama-server -m /models/phi-3-mini-4k-instruct.Q4_K_M.gguf --host 0.0.0.0 --port 8080"

volumes:
  llama_models:
