[project]
name = "routeweave"
version = "0.1.0"
description = "Automatically route LLM prompts to the right model tier based on task type, complexity, and cost"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Varun Bhogayta" }
]
keywords = ["llm", "routing", "ai", "mlops", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "litellm>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/yourname/routeweave"
Documentation = "https://github.com/yourname/routeweave/tree/main/docs"
Repository = "https://github.com/yourname/routeweave"
Issues = "https://github.com/yourname/routeweave/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router", "models"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
